plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.jakubzietarski.linumert.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.jakubzietarski.linumert.mobile'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-dev.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
