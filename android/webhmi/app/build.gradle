plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'pl.jakubzietarski.linumert.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.jakubzietarski.linumert.mobile'
        minSdk 29
        targetSdk 35
        ndk {
            abiFilters 'arm64-v8a'
        }
        versionCode 2
        versionName '0.2.0-dev.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Stage 1: CPython loopback diagnostic only. No machine-control backend is bundled.
chaquopy {
    defaultConfig {
        version '3.11'
    }
}
